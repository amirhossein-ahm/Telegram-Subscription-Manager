{% extends "base.html" %}

{% block title %}
Login - Telegram Subscription Manager
{% endblock %}

{% block content %}

<div class="login-wrapper">

    <div class="card login-card shadow-sm">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    Telegram Subscription Manager
                </h2>

                <p class="text-muted mb-0">
                    Administrator Login
                </p>

            </div>

            <form method="POST">

                <div class="mb-3">

                    <label
                        class="form-label"
                        for="username"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        required
                        autocomplete="username"
                    >

                </div>

                <div class="mb-4">

                    <label
                        class="form-label"
                        for="password"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        required
                        autocomplete="current-password"
                    >

                </div>

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Sign In
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
